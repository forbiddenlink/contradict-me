name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check Formatting
        run: pnpm format:check
        continue-on-error: true

      - name: Test
        # pnpm test now runs vitest (package.json), not Jest. CI never ran
        # vitest at all before this, which is how the suite collected 0 tests
        # for two days with nothing failing loudly. passWithNoTests is false
        # in vitest.config.ts, so a suite that collects 0 tests exits non-zero
        # here instead of reading as "nothing to run, fine".
        run: pnpm test
